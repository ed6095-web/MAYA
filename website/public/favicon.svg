<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 70" width="120" height="70" fill="none">
  <!-- Outer glowing aura filter -->
  <defs>
    <filter id="eye-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <linearGradient id="eye-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD21A" />
      <stop offset="50%" stop-color="#F5C400" />
      <stop offset="100%" stop-color="#C9A84C" />
    </linearGradient>
    <linearGradient id="pupil-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFDE43" />
      <stop offset="100%" stop-color="#DDA922" />
    </linearGradient>
  </defs>

  <!-- Eye outer almond contours (two intersecting stylized eyelids) -->
  <path d="M 10 35 C 32 8, 88 8, 110 35 C 88 62, 32 62, 10 35 Z" 
        stroke="url(#eye-gold)" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#eye-glow)"/>

  <!-- Inner delicate eyelid contour -->
  <path d="M 22 35 C 38 18, 82 18, 98 35 C 82 52, 38 52, 22 35 Z" 
        stroke="#F5C400" 
        stroke-width="1.2" 
        stroke-opacity="0.6"/>

  <!-- Concentric Outer Iris Ring -->
  <circle cx="60" cy="35" r="18" 
          stroke="url(#eye-gold)" 
          stroke-width="3" 
          fill="#050505"/>

  <!-- Concentric Inner Iris Ring -->
  <circle cx="60" cy="35" r="11" 
          stroke="#FFD21A" 
          stroke-width="1.8" 
          fill="none"/>

  <!-- Center Pupil -->
  <circle cx="60" cy="35" r="5.5" 
          fill="url(#pupil-gold)"/>

  <!-- Specular highlight point -->
  <circle cx="63" cy="32" r="1.5" 
          fill="#FFFFFF" 
          fill-opacity="0.9"/>
</svg>
